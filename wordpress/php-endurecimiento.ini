; =============================================================================
; ENDURECIMIENTO DEL INTERPRETE PHP
; Proyecto Semestral - Seguridad en los Sistemas de Informacion - UTP FISC
;
; Este archivo se copia a /usr/local/etc/php/conf.d/zz-endurecimiento.ini
; El prefijo "zz" garantiza que se cargue de ultimo y sus valores prevalezcan.
; =============================================================================
; -----------------------------------------------------------------------------
; 1. OCULTAMIENTO DE INFORMACION
; -----------------------------------------------------------------------------
; expose_php = Off elimina la cabecera "X-Powered-By: PHP/8.3.x" de todas las
; respuestas. Esa cabecera le entrega gratis a un atacante la version exacta del
; interprete, con la que puede buscar directamente los CVE aplicables.
expose_php = Off
; -----------------------------------------------------------------------------
; 2. GESTION DE ERRORES
; -----------------------------------------------------------------------------
; Los mensajes de error de PHP suelen revelar rutas absolutas del sistema de
; archivos, nombres de tablas y fragmentos de consultas SQL. En produccion se
; registran en un archivo pero NUNCA se muestran al visitante.
display_errors = Off
display_startup_errors = Off
log_errors = On
error_log = /var/log/php_errors.log
error_reporting = E_ALL & ~E_DEPRECATED & ~E_STRICT
; -----------------------------------------------------------------------------
; 3. DESACTIVACION DE FUNCIONES PELIGROSAS
; -----------------------------------------------------------------------------
; Esta es la medida individual mas importante de este archivo.
;
; Todas las funciones listadas permiten ejecutar comandos del sistema operativo
; desde codigo PHP. Son precisamente las que utiliza cualquier "web shell" tras
; una subida maliciosa. WordPress y sus plugins habituales no las necesitan.
;
; Efecto practico: aunque un atacante logre subir y ejecutar codigo PHP, no
; podra invocar comandos del sistema. Se le corta la escalada desde
; "ejecucion de PHP" hasta "control del servidor".
disable_functions = exec,passthru,shell_exec,system,proc_open,popen,parse_ini_file,show_source,pcntl_exec,proc_get_status,proc_nice,proc_terminate,dl,symlink,link
; -----------------------------------------------------------------------------
; 4. RESTRICCION DE ACCESO AL SISTEMA DE ARCHIVOS
; -----------------------------------------------------------------------------
; open_basedir limita las rutas que PHP puede leer o escribir. Contiene los
; ataques de salto de directorio (path traversal): una peticion que intente
; leer ../../../../etc/passwd sera denegada por el propio interprete.
open_basedir = /var/www/html:/tmp:/usr/local/lib/php:/var/log
; -----------------------------------------------------------------------------
; 5. INCLUSION REMOTA DE ARCHIVOS
; -----------------------------------------------------------------------------
; allow_url_include = Off bloquea la vulnerabilidad RFI (Remote File Inclusion),
; en la que un parametro manipulado hace que PHP descargue y ejecute codigo
; alojado en un servidor del atacante.
allow_url_fopen = On ; requerido por la API HTTP de WordPress
allow_url_include = Off ; jamas debe activarse
; -----------------------------------------------------------------------------
; 6. SESIONES
; -----------------------------------------------------------------------------
; cookie_httponly impide que JavaScript lea la cookie de sesion, mitigando el
; robo de sesion por XSS.
; cookie_secure obliga a que la cookie viaje solo por HTTPS.
; cookie_samesite=Strict mitiga el CSRF.
; use_strict_mode rechaza identificadores de sesion no generados por el
; servidor, evitando la fijacion de sesion.
session.cookie_httponly = On
session.cookie_secure = On
session.cookie_samesite = Strict
session.use_strict_mode = On
session.use_only_cookies = On
; -----------------------------------------------------------------------------
; 7. LIMITES DE RECURSOS
; -----------------------------------------------------------------------------
; Ademas de estabilidad, son una defensa contra la denegacion de servicio: una
; peticion maliciosa no puede consumir memoria o CPU indefinidamente.
memory_limit = 256M
max_execution_time = 60
max_input_time = 60
max_input_vars = 1500
post_max_size = 64M
upload_max_filesize = 64M
file_uploads = On
; -----------------------------------------------------------------------------
; 8. CACHE DE CODIGO COMPILADO (OPCACHE)
; -----------------------------------------------------------------------------
; Mejora el rendimiento y contribuye a la DISPONIBILIDAD: menos CPU por
; peticion significa mayor capacidad de usuarios concurrentes con el mismo
; hardware.
;
; validate_timestamps = 0 desactiva la revalidacion de archivos, coherente con
; la infraestructura inmutable: el codigo no cambia mientras el contenedor vive.
opcache.enable = 1
opcache.memory_consumption = 128
opcache.max_accelerated_files = 10000
opcache.revalidate_freq = 0
opcache.validate_timestamps = 0
opcache.save_comments = 1
; -----------------------------------------------------------------------------
; 9. ZONA HORARIA
; -----------------------------------------------------------------------------
; Importante para la auditoria: las marcas de tiempo de los registros deben
; corresponder a la hora local para poder correlacionar eventos.
date.timezone = America/Panama
