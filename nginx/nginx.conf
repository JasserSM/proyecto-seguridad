# =============================================================================
# NGINX - CONFIGURACION PRINCIPAL
# Proyecto Semestral - Seguridad en los Sistemas de Informacion - UTP FISC
#
# Este archivo define el comportamiento global del balanceador de carga.
# Los bloques "server" concretos viven en conf.d/wordpress.conf
# =============================================================================
# Usuario sin privilegios bajo el que corren los procesos de trabajo.
# El proceso maestro necesita root para abrir el puerto 443 (< 1024), pero los
# trabajadores que atienden el trafico real no. Principio de minimo privilegio.
user nginx;
# Un proceso de trabajo por nucleo disponible. La instancia t3.medium tiene 2.
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;
events {
worker_connections 1024;
multi_accept on;
}
http {
include /etc/nginx/mime.types;
default_type application/octet-stream;
# -------------------------------------------------------------------------
# REGISTRO DE ACCESOS
# -------------------------------------------------------------------------
# Se agrega $upstream_addr al formato estandar. Ese campo indica CUAL de los
# dos contenedores WordPress atendio cada peticion, y es la evidencia
# directa de que el balanceo de carga esta funcionando.
# -------------------------------------------------------------------------
log_format balanceo '$remote_addr - $remote_user [$time_local] '
'"$request" $status $body_bytes_sent '
'"$http_referer" "$http_user_agent" '
'servidor_backend=$upstream_addr '
'tiempo_respuesta=$upstream_response_time';
access_log /var/log/nginx/access.log balanceo;
sendfile on;
tcp_nopush on;
tcp_nodelay on;
keepalive_timeout 65;
types_hash_max_size 2048;
# Tamano maximo de subida. Debe coincidir con upload_max_filesize de PHP,
# o nginx cortara la peticion antes de que WordPress la vea (error 413).
client_max_body_size 64M;
# -------------------------------------------------------------------------
# OCULTAMIENTO DE VERSION
# -------------------------------------------------------------------------
# Evita que nginx anuncie su numero de version en las cabeceras y en las
# paginas de error. Es seguridad por oscuridad -no es una defensa real- pero
# elimina un dato gratuito para quien automatiza la busqueda de servidores
# con versiones vulnerables conocidas (CVE).
# -------------------------------------------------------------------------
server_tokens off;
# -------------------------------------------------------------------------
# ZONAS DE LIMITACION DE TASA (RATE LIMITING)
# -------------------------------------------------------------------------
# Se declaran aqui y se aplican en las rutas sensibles de conf.d.
#
# zona_login : 5 peticiones por minuto por IP contra wp-login.php.
# Frena los ataques de fuerza bruta a nivel de proxy, ANTES
# de que la peticion consuma PHP y una conexion a la base de
# datos. Es mucho mas eficiente que dejar que un plugin de
# WordPress lo bloquee despues.
#
# zona_general: 30 peticiones por segundo por IP para el resto del sitio.
# Mitigacion basica de denegacion de servicio.
#
# El tamano 10m almacena aproximadamente 160 000 direcciones IP.
# -------------------------------------------------------------------------
limit_req_zone $binary_remote_addr zone=zona_login:10m rate=5r/m;
limit_req_zone $binary_remote_addr zone=zona_general:10m rate=30r/s;
# Limite de conexiones simultaneas por IP.
limit_conn_zone $binary_remote_addr zone=conexiones:10m;
# Codigo devuelto al exceder el limite. 429 = Too Many Requests.
limit_req_status 429;
limit_conn_status 429;
# -------------------------------------------------------------------------
# COMPRESION
# -------------------------------------------------------------------------
# Nota de seguridad: la compresion HTTPS es teoricamente vulnerable al
# ataque BREACH, que explota la correlacion entre el tamano de la respuesta
# comprimida y secretos embebidos en ella. Se mitiga comprimiendo solo tipos
# de contenido estatico y NUNCA text/html dinamico con tokens.
# -------------------------------------------------------------------------
gzip on;
gzip_vary on;
gzip_proxied no-cache no-store private expired auth;
gzip_min_length 1024;
gzip_types text/plain text/css application/json
application/javascript text/xml application/xml
image/svg+xml;
# -------------------------------------------------------------------------
# GRUPO DE SERVIDORES DE APLICACION (UPSTREAM)
# -------------------------------------------------------------------------
# Este bloque ES el balanceador de carga.
#
# Algoritmo: least_conn (menor numero de conexiones activas). Se prefiere
# sobre round-robin porque WordPress tiene peticiones de duracion muy
# desigual: cargar el panel de administracion cuesta mucho mas que servir
# una hoja de estilos. least_conn evita que un nodo quede saturado con
# peticiones lentas mientras el otro esta ocioso.
#
# Verificacion de salud (pasiva):
# max_fails=3 -> tras 3 fallos consecutivos el nodo se marca caido
# fail_timeout=15s-> se le deja fuera 15 s y luego se reintenta
#
# Este es el mecanismo que da ALTA DISPONIBILIDAD: si wordpress1 muere,
# nginx lo detecta y envia el 100% del trafico a wordpress2 sin que el
# usuario perciba interrupcion.
# -------------------------------------------------------------------------
upstream servidores_wordpress {
least_conn;
server wordpress1:80 max_fails=3 fail_timeout=15s;
server wordpress2:80 max_fails=3 fail_timeout=15s;
# Conexiones persistentes hacia los backends: reduce la latencia al
# evitar renegociar TCP en cada peticion.
keepalive 32;
}
include /etc/nginx/conf.d/*.conf;
}
