# =============================================================================
# NGINX - SERVIDORES VIRTUALES
# Proyecto Semestral - Seguridad en los Sistemas de Informacion - UTP FISC
# =============================================================================
# =============================================================================
# BLOQUE 1 - PUERTO 80 (HTTP)
# -----------------------------------------------------------------------------
# El perfil del proyecto exige que el sitio responda por HTTPS y NO por HTTP.
# Se implementa con una redireccion permanente 301, que es la practica correcta
# frente a simplemente cerrar el puerto:
#
# - Cerrar el puerto deja al usuario con un error de conexion rechazada, sin
# forma de llegar al sitio si escribe la direccion sin el prefijo https://
# - La redireccion 301 lo lleva a HTTPS y, combinada con la cabecera HSTS que
# se envia en el bloque 443, hace que el navegador recuerde la regla y ni
# siquiera intente HTTP en las visitas siguientes.
#
# Ningun contenido de la aplicacion se sirve jamas por el puerto 80.
# =============================================================================
server {
listen 80 default_server;
listen [::]:80 default_server;
server_name _;
# Unica excepcion permitida en HTTP: nada. Todo se redirige.
location / {
return 301 https://$host$request_uri;
}
}
# =============================================================================
# BLOQUE 2 - PUERTO 443 (HTTPS) -- SITIO PRINCIPAL
# =============================================================================
server {
listen 443 ssl;
listen [::]:443 ssl;
http2 on;
server_name _;
# -------------------------------------------------------------------------
# CERTIFICADO
# -------------------------------------------------------------------------
# Emitido por scripts/generar-cert.sh en el arranque del stack.
ssl_certificate /etc/nginx/certs/servidor.crt;
ssl_certificate_key /etc/nginx/certs/servidor.key;
ssl_dhparam /etc/nginx/certs/dhparam.pem;
# -------------------------------------------------------------------------
# PROTOCOLO TLS
# -------------------------------------------------------------------------
# El perfil solicita TLS 1.2. Se declara EXCLUSIVAMENTE esa version, lo que
# implica rechazar activamente:
# SSLv2 y SSLv3 : rotos (POODLE, DROWN)
# TLS 1.0 : vulnerable a BEAST, prohibido por PCI-DSS desde 2018
# TLS 1.1 : obsoleto, usa algoritmos de resumen debiles
#
# Esto es verificable con:
# nmap --script ssl-enum-ciphers -p 443 <IP>
# que debe reportar unicamente TLSv1.2.
# -------------------------------------------------------------------------
ssl_protocols TLSv1.2;
# -------------------------------------------------------------------------
# SUITES DE CIFRADO
# -------------------------------------------------------------------------
# Solo se permiten suites con:
# ECDHE/DHE -> intercambio de llaves efimero = Perfect Forward Secrecy
# AES-GCM / CHACHA20-POLY1305 -> cifrado autenticado (AEAD)
#
# Quedan excluidos por construccion: RC4, 3DES, DES, MD5, exportacion, y
# todas las suites sin autenticacion (aNULL) o sin cifrado (eNULL).
# -------------------------------------------------------------------------
ssl_ciphers 'ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES128-GCM-SHA256';
# El servidor impone su orden de preferencia en lugar de aceptar el del
# cliente, para que un navegador antiguo no pueda negociar a la baja.
ssl_prefer_server_ciphers on;
# Cache de sesiones TLS: evita repetir el costoso apreton de manos completo.
ssl_session_cache shared:SSL:10m;
ssl_session_timeout 10m;
ssl_session_tickets off; # los tickets debilitan PFS si no se rotan bien
# -------------------------------------------------------------------------
# CABECERAS DE SEGURIDAD HTTP
# -------------------------------------------------------------------------
# HSTS: instruye al navegador a usar HTTPS exclusivamente durante un anio.
# Neutraliza el ataque de degradacion SSL stripping, en el que un atacante
# en la red intercepta la primera peticion HTTP y evita que se llegue a
# HTTPS. "always" garantiza que se envie tambien en respuestas de error.
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always
;
# Impide que el sitio se cargue dentro de un iframe ajeno.
# Mitiga el clickjacking (superponer una capa invisible sobre botones).
add_header X-Frame-Options "SAMEORIGIN" always;
# Impide que el navegador "adivine" el tipo MIME de un archivo. Sin esto,
# un .txt subido con contenido HTML podria ejecutarse como pagina.
add_header X-Content-Type-Options "nosniff" always;
# Controla cuanta informacion de origen se filtra al navegar hacia afuera.
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
# Revoca por defecto el acceso a camara, microfono y geolocalizacion.
add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
# CSP en modo permisivo. WordPress y sus plugins usan JavaScript en linea de
# forma intensiva, por lo que una politica estricta rompe el panel de
# administracion. Se documenta como linea de mejora futura.
add_header Content-Security-Policy "default-src 'self' https: data: 'unsafe-inline' 'unsafe-eval'; frame-ancestors 'self'" always;
# -------------------------------------------------------------------------
# LIMITE GLOBAL
# -------------------------------------------------------------------------
limit_conn conexiones 20;
# -------------------------------------------------------------------------
# RUTA PROTEGIDA 1: PANTALLA DE INICIO DE SESION
# -------------------------------------------------------------------------
# wp-login.php es el objetivo numero uno de los ataques de fuerza bruta
# automatizados contra WordPress. Se limita a 5 intentos por minuto por IP.
#
# burst=3 -> tolera una rafaga corta de 3 peticiones
# nodelay -> las atiende de inmediato en vez de encolarlas
#
# Esta es la PRIMERA capa. La segunda es el plugin de limitacion de accesos
# dentro de WordPress. Defensa en profundidad: si un atacante evade una, la
# otra sigue en pie.
# -------------------------------------------------------------------------
location = /wp-login.php {
limit_req zone=zona_login burst=3 nodelay;
proxy_pass http://servidores_wordpress;
include /etc/nginx/conf.d/cabeceras-proxy.inc;
}
# -------------------------------------------------------------------------
# RUTA PROTEGIDA 2: XML-RPC
# -------------------------------------------------------------------------
# xmlrpc.php permite publicar de forma remota, pero es abusado para dos
# ataques graves:
# 1. Amplificacion de fuerza bruta: el metodo system.multicall permite
# probar cientos de contrasenas en UNA sola peticion HTTP, evadiendo
# cualquier contador de intentos fallidos.
# 2. Pingback DDoS: convierte al sitio en amplificador contra terceros.
#
# No lo usamos, asi que se deniega por completo a nivel de proxy.
# -------------------------------------------------------------------------
location = /xmlrpc.php {
deny all;
access_log off;
return 403;
}
# -------------------------------------------------------------------------
# RUTA PROTEGIDA 3: ARCHIVOS SENSIBLES
# -------------------------------------------------------------------------
# Bloquea el acceso directo a archivos de configuracion, respaldos, control
# de versiones y archivos ocultos que nunca deben ser publicos.
# -------------------------------------------------------------------------
location ~* /(wp-config\.php|\.env|\.git|\.htaccess|readme\.html|license\.txt) {
deny all;
return 403;
}
location ~* \.(sql|bak|backup|log|old|swp|tar|gz|zip)$ {
deny all;
return 403;
}
# Impide la ejecucion de PHP dentro del directorio de subidas. Si un
# atacante logra subir una shell disfrazada de imagen, no podra ejecutarla.
location ~* /wp-content/uploads/.*\.php$ {
deny all;
return 403;
}
# -------------------------------------------------------------------------
# BLOQUEO DE ENUMERACION DE USUARIOS
# -------------------------------------------------------------------------
# Una peticion a /?author=1 redirige al perfil y revela el nombre de usuario
# real del administrador, que es la mitad de las credenciales. Se bloquea.
# -------------------------------------------------------------------------
if ($args ~* "author=\d+") {
return 403;
}
# -------------------------------------------------------------------------
# RUTA POR DEFECTO: TODO EL TRAFICO RESTANTE HACIA EL BALANCEADOR
# -------------------------------------------------------------------------
location / {
limit_req zone=zona_general burst=20 nodelay;
proxy_pass http://servidores_wordpress;
include /etc/nginx/conf.d/cabeceras-proxy.inc;
# Reintento automatico en el otro nodo si este falla. Es la pieza que
# hace que la caida de un contenedor sea invisible para el usuario.
proxy_next_upstream error timeout http_502 http_503 http_504;
proxy_next_upstream_tries 2;
proxy_next_upstream_timeout 10s;
}
# -------------------------------------------------------------------------
# CONTENIDO ESTATICO
# -------------------------------------------------------------------------
location ~* \.(jpg|jpeg|png|gif|ico|css|js|svg|woff|woff2|ttf)$ {
proxy_pass http://servidores_wordpress;
include /etc/nginx/conf.d/cabeceras-proxy.inc;
expires 30d;
add_header Cache-Control "public, no-transform";
access_log off;
}
}
